name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        pacman -Syu --noconfirm
        pacman -S --noconfirm go libqalculate pkgconf gcc

    - name: Setup Go
      working-directory: ./src
      run: go mod download

    - name: Build binaries
      working-directory: ./src
      run: |
        VERSION="${GITHUB_REF_NAME}"
        go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o ../nasc-linux-amd64
        cd ..
        sha256sum nasc-linux-amd64 > nasc-linux-amd64.sha256

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          nasc-linux-amd64
          nasc-linux-amd64.sha256
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
